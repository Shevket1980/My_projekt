name: Build LibreTube VOT

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout LibreTube v31.4
        uses: actions/checkout@v4
        with:
          repository: libre-tube/LibreTube
          ref: v31.4
          path: LibreTube

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: LibreTube/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply VOT integration
        run: |
          python3 integration/apply_vot_patch.py LibreTube
          python3 integration/apply_vot_ui_state.py LibreTube
          python3 integration/apply_vot_progress_r7.py LibreTube
          python3 integration/apply_vot_voice_backend.py LibreTube
          cp integration/app/src/main/res/values/vot_strings.xml LibreTube/app/src/main/res/values/vot_strings.xml
          cp integration/app/src/main/res/values-ru/vot_strings.xml LibreTube/app/src/main/res/values-ru/vot_strings.xml
          python3 integration/apply_vot_voice_modes.py LibreTube
          python3 integration/apply_vot_button_r9.py LibreTube

      - name: Verify patch markers
        run: |
          grep -q 'toggleVotTranslation' LibreTube/app/src/main/java/com/github/libretube/ui/views/CustomExoPlayerView.kt
          grep -q '#BB86FC' LibreTube/app/src/main/java/com/github/libretube/ui/views/CustomExoPlayerView.kt
          grep -q 'showVotProgress' LibreTube/app/src/main/java/com/github/libretube/ui/views/CustomExoPlayerView.kt
          grep -q 'delayWithProgress' LibreTube/app/src/main/java/com/github/libretube/vot/VotApiClient.kt
          grep -q '@+id/vot_status' LibreTube/app/src/main/res/layout/exo_styled_player_control_view.xml
          grep -q 'VoiceMode.LIVELY' LibreTube/app/src/main/java/com/github/libretube/ui/views/CustomExoPlayerView.kt
          grep -q 'useLivelyVoice' LibreTube/app/src/main/java/com/github/libretube/vot/VotProto.kt
          grep -q 'isLivelyVoice' LibreTube/app/src/main/java/com/github/libretube/vot/VotProto.kt
          grep -q 'getVideoTitle' LibreTube/app/src/main/java/com/github/libretube/ui/interfaces/CustomPlayerCallback.kt
          grep -q 'vot_lively_voices_title' LibreTube/app/src/main/res/values-ru/vot_strings.xml
          grep -q 'binding.votToggle.bringToFront()' LibreTube/app/src/main/java/com/github/libretube/ui/views/CustomExoPlayerView.kt
          grep -q 'style="@style/PlayerControlBottom"' LibreTube/app/src/main/res/layout/exo_styled_player_control_view.xml
          test -f LibreTube/app/src/main/java/com/github/libretube/vot/VotApiClient.kt
          test -f LibreTube/app/src/main/java/com/github/libretube/vot/VotAudioController.kt
          test -f LibreTube/app/src/main/java/com/github/libretube/vot/VotProto.kt

      - name: Build debug APK
        working-directory: LibreTube
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK artifact
        run: |
          APK="$(find LibreTube/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" LibreTube-VOT-v31.4-r9-debug.apk
          sha256sum LibreTube-VOT-v31.4-r9-debug.apk > LibreTube-VOT-v31.4-r9-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreTube-VOT-v31.4-r9-debug
          path: |
            LibreTube-VOT-v31.4-r9-debug.apk
            LibreTube-VOT-v31.4-r9-debug.apk.sha256
          if-no-files-found: error

  build-macos-m1:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundle metadata
        run: plutil -lint macos/Info.plist

      - name: Apply Swift 6 compatibility
        run: python3 macos/patch_swift6.py

      - name: Build native Apple Silicon app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/LibreTube VOT.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          mkdir -p "$MACOS"
          cp macos/Info.plist "$CONTENTS/Info.plist"

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc \
            -swift-version 5 \
            -Xfrontend -strict-concurrency=minimal \
            -O \
            -whole-module-optimization \
            -sdk "$SDKROOT" \
            -target arm64-apple-macos13.0 \
            -framework AppKit \
            -framework WebKit \
            -framework AVFoundation \
            -framework CryptoKit \
            macos/Sources/*.swift \
            -o "$MACOS/LibreTubeVOT"

          chmod +x "$MACOS/LibreTubeVOT"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$MACOS/LibreTubeVOT"
          lipo -info "$MACOS/LibreTubeVOT"

      - name: Package ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist dmg-root
          cp -R "build/LibreTube VOT.app" dmg-root/
          ln -s /Applications dmg-root/Applications

          ditto -c -k --sequesterRsrc --keepParent \
            "build/LibreTube VOT.app" \
            "dist/LibreTube-VOT-macOS-M1-arm64.zip"

          hdiutil create \
            -volname "LibreTube VOT" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/LibreTube-VOT-macOS-M1-arm64.dmg"

          (cd dist && shasum -a 256 LibreTube-VOT-macOS-M1-arm64.zip LibreTube-VOT-macOS-M1-arm64.dmg > LibreTube-VOT-macOS-M1-arm64.sha256)
          ls -lh dist

      - name: Upload macOS M1 app
        uses: actions/upload-artifact@v4
        with:
          name: LibreTube-VOT-macOS-M1-arm64
          path: |
            dist/LibreTube-VOT-macOS-M1-arm64.zip
            dist/LibreTube-VOT-macOS-M1-arm64.dmg
            dist/LibreTube-VOT-macOS-M1-arm64.sha256
          if-no-files-found: error
